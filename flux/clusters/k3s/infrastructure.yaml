apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/clusters/k3s/metallb
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: metallb
  path: ./flux/clusters/k3s/metallb-config
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: metallb-config
  path: ./flux/clusters/k3s/istio
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: metallb-config
  path: ./flux/clusters/k3s/monitoring
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: istio
  path: ./flux/clusters/k3s/external-dns
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-monitoring
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: istio
    - name: monitoring
  path: ./flux/clusters/k3s/istio-monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
