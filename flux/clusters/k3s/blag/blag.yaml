apiVersion: v1
kind: Namespace
metadata:
  name: blag
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blag
  namespace: blag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blag
  template:
    metadata:
      labels:
        app: blag
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: blag
      containers:
        - name: blag
          image: ghcr.io/roylarsen/blag:4f3d3525b5c42f17cc156de2a0d36c651b103a9d
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args: ["--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"]
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: blag
  namespace: blag
  labels:
    app: blag
spec:
  selector:
    app: blag
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blag
  namespace: blag
spec:
  selector:
    matchLabels:
      app: blag
  endpoints:
    - port: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blag
  namespace: blag
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: blag
