apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    # k3s runs these control-plane components inside one process, so their
    # metrics endpoints are not scrapeable the way the chart expects.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    prometheus:
      prometheusSpec:
        # pick up ServiceMonitors/PodMonitors defined outside this release (e.g. Istio)
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
    grafana:
      # null drops the chart's default password so Grafana generates a random one
      # in the kube-prometheus-stack-grafana secret.
      adminPassword: null
      service:
        type: ClusterIP
        port: 80
      grafana.ini:
        server:
          root_url: https://grafana.xhousebreakx.org
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        size: 2Gi
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: istio
              orgId: 1
              folder: Istio
              type: file
              disableDeletion: false
              options:
                path: /var/lib/grafana/dashboards/istio
      dashboards:
        istio:
          istio-mesh:
            gnetId: 7639
            revision: 334
            datasource: Prometheus
          istio-service:
            gnetId: 7636
            revision: 333
            datasource: Prometheus
          istio-workload:
            gnetId: 7630
            revision: 334
            datasource: Prometheus
          istio-control-plane:
            gnetId: 7645
            revision: 333
            datasource: Prometheus
